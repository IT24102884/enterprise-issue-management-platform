spring:
  application:
    name: enterprise-pm

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/projectmanager}
    username: ${DATABASE_USERNAME:pmuser}
    password: ${DATABASE_PASSWORD:pmpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:myVerySecretKeyForDevelopmentOnlyPleaseChangeInProduction12345}
    expiration: 86400000
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: Enterprise Issue Management Platform API
    description: Production-style Jira-inspired project management system
    version: 1.0.0

logging:
  level:
    com.projectmanager: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
